---
layout: default
---
<div class="page-wrap">
  <div class="page-header">
    <span class="tag">News</span>
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
  </div>
  <div class="content">
    {{ content }}
  </div>
  <div class="post-back">
    <a href="{{ site.baseurl }}/news/">&larr; All news</a>
  </div>
</div>
