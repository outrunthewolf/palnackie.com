body_md: |
  ## What Is Buittle Quest?

  Buittle Quest is a Scottish Charitable Incorporated Organisation, SC049978, set up by Buittle Parish Community Council for the benefit of the people of Buittle Parish and members of the public, groups and organisations visiting the area. See the [Buittle Parish Boundary Map](https://dumgal.maps.arcgis.com/apps/webappviewer/index.html?id=e16bf24a1491423e86e6bdd1f90d06ed&query=Community%20Councils,id,71) here.

  ## What Does Buittle Quest Do?

  Buittle Quest manages the [Village Hall](/village-hall/) and the North Shore of Palnackie Port for the community's benefit and have secured funding for and delivered: Music & Memories (2024–26), a Local Place Plan and two cultural programmes, with free to attend events for families in the Parish. Buittle Quest have hosted various coffee mornings, annual Family Summer BBQs and a Christmas Fayre. It provides development support to [Flounders Community Cafe](/flounders/), [The Village Shop](/village-shop/) and the Palnackie Park Pals, who are taking forward plans to refurbish the local Play Park. Buittle Quest has also provided financial support to local events such as the annual pensioners Xmas dinner and school items when the local primary school was still open.

  The charity is managed by a board of trustees drawn from the local community and work with a freelance development officer and consultants to take forward their aims of:

  - Developing the community through activities including increased community engagement in consultations and community planning.
  - Preserving and promoting the local heritage assets.
  - Providing recreational and cultural facilities and activities.
  - Protecting and improving the local environment with aims to promote the use of renewable energy.
  - Improving the lives of vulnerable and disadvantaged people in the area by working towards the provision of support services, and by improving and maintaining public amenities.

  ## Buittle Quest Trustees

  The current Board of Buittle Quest are all volunteers and live in the local area. They are:

  - Angus Campbell (Chairperson)
  - Lorraine Light (Treasurer)
  - Kathryn Vereycken (Secretary)
  - Jenny Chapman
  - Bob Shipway
  - Jim Niven
  - Vivianne Brown
  - Fiona Anderson
  - Carolann Glover
