lead: "Come and have a pint or a soft drink, meet up with folk, play darts or pool, watch the sport and enjoy a light bite."
body_md: |
  The Glenisle is Palnackie's community local: a proper village pub where you'll be welcomed whether you're a regular or visiting the area for the first time. Come for a pint, a soft drink or a light bite, catch the sport on TV, play darts or pool, or just enjoy the kind of unhurried atmosphere that a good village pub does best.

  If you're visiting Palnackie for the first time, the Glenisle is a good place to get your bearings — locals are happy to point you towards walks, sights and places to eat nearby.

  Please check the **Glenisle Inn Facebook page** for the current opening schedule and any changes to times or upcoming events.
